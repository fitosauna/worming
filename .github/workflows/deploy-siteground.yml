name: Deploy to SiteGround

# Uploads the site to SiteGround over SSH every time main changes.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SG_HOST     SSH hostname from SiteGround Site Tools > Devs > SSH Keys Manager > Manage > SSH Credentials
#   SG_PORT     SSH port (SiteGround uses 18765)
#   SG_USER     SSH username (looks like u123-abc456def789)
#   SG_SSH_KEY  private key from SiteGround SSH Keys Manager (or your own key)
#   SG_SSH_PASSPHRASE  the key's password, if it has one
#   SG_PATH     target folder, e.g. www/wormingbio.com/public_html/  (keep the trailing slash)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          if [ -z "$SG_HOST" ] || [ -z "$SG_PATH" ]; then
            echo "SiteGround secrets are not set yet, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > ~/.ssh/siteground
          chmod 600 ~/.ssh/siteground
          # SiteGround keys have a password: remove it from this temporary copy so rsync can run unattended.
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -q -P "$SG_SSH_PASSPHRASE" -N "" -f ~/.ssh/siteground
          fi
          ssh-keyscan -p "${SG_PORT:-18765}" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files
        if: steps.check.outputs.ready == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          # No --delete: files already on the server (SiteGround's .htaccess, SSL files) are left alone.
          rsync -rlvz --exclude-from=.deployignore \
            -e "ssh -p ${SG_PORT:-18765} -i ~/.ssh/siteground" \
            ./ "$SG_USER@$SG_HOST:$SG_PATH"

      - name: Flush SiteGround dynamic cache
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          # The domain is the folder name in SG_PATH (www/<domain>/public_html/).
          DOMAIN=$(echo "$SG_PATH" | sed -E 's#^.*www/([^/]+)/.*$#\1#')
          echo "Purging https://$DOMAIN/*"
          ssh -p "${SG_PORT:-18765}" -i ~/.ssh/siteground "$SG_USER@$SG_HOST" \
            "curl -s -o /dev/null -w '%{http_code}\n' -k -X PURGE 'https://$DOMAIN/*'" || true
          curl -s -o /dev/null -w '%{http_code}\n' -X PURGE "https://$DOMAIN/*" || true
